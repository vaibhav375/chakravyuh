<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chakravyuh Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Anek+Latin:wght@400;500;700&family=Anek+Kannada:wght@400;500;700&family=Anek+Devanagari:wght@400;500;700&family=Anek+Tamil:wght@400;500;700&family=Anek+Telugu:wght@400;500;700&family=Anek+Malayalam:wght@400;500;700&family=Anek+Bangla:wght@400;500;700&family=Anek+Gujarati:wght@400;500;700&family=Anek+Gurmukhi:wght@400;500;700&family=Tiro+Devanagari+Sanskrit&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* gsap.com's language: near-black, bright colour blocks, rounded bento cards, chunky type, bouncy motion.
     Each scam stage owns a colour; orange is always the scammer, green is always what we caught. */
  :root {
    --ink: #0e100f;
    --card: #1a1b19;
    --raise: #242522;
    --line: #34352f;
    --cream: #fffce1;
    --mist: #a8a795;
    --green: #0ae448;     /* caught */
    --orange: #ff8709;    /* the scammer */
    --lilac: #9d95ff;     /* the persona */
    --blue: #00bae2;
    --pink: #fe53bb;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Anek Latin", "Anek Kannada", "Anek Devanagari", "Anek Tamil", "Anek Telugu", "Anek Malayalam", "Anek Bangla", "Anek Gujarati", "Anek Gurmukhi", system-ui, sans-serif;
    --data: "Martian Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--cream);
    font: 400 16px/1.45 var(--body);
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px; height: 100vh; padding: 12px;
  }
  .card { background: var(--card); border-radius: 26px; }
  a:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; border-radius: 6px; }

  /* header: an identity card and three colour blocks */
  header { display: flex; gap: 12px; }
  .id { flex: 1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 16px 26px; }
  .brand { display: grid; gap: 2px; }
  .brand .mark { font: 400 38px/1 "Tiro Devanagari Sanskrit", serif; }
  .brand .latin { font: 700 13px/1 var(--display); color: var(--mist); }
  .line { font: 700 18px var(--display); }
  .line small { color: var(--mist); font: 400 14px var(--body); }
  .status { display: flex; align-items: center; gap: 8px; font: 600 14px var(--display); color: var(--mist);
    background: var(--raise); border-radius: 999px; padding: 7px 16px 7px 12px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mist); }
  .status.live { color: var(--cream); }
  .status.live .dot { background: var(--green); animation: pulse 1.4s ease-in-out infinite; }
  .report-link { font: 700 14px var(--display); color: var(--ink); background: var(--green); border-radius: 999px; padding: 7px 16px; text-decoration: none; }
  .counters { display: flex; gap: 12px; }
  .counter { display: grid; align-content: space-between; gap: 6px; min-width: 150px; padding: 14px 20px 16px; border-radius: 26px; color: var(--ink); }
  .counter.time { background: var(--orange); }
  .counter.caught { background: var(--green); }
  .counter.fails { background: var(--lilac); }
  .counter span { font: 700 13px/1.1 var(--display); }
  .counter b { font: 800 46px/.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

  /* main */
  main { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 12px; min-height: 0; }
  .vyuh { padding: 24px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .vortex { flex: 1 1 0; min-height: 160px; max-width: 100%; aspect-ratio: 1; }  /* shrinks with the card's height */
  .vortex svg { width: 100%; height: 100%; overflow: visible; }
  .hook { --c: var(--blue); } .threat { --c: var(--orange); } .isolation { --c: var(--pink); } .payment_ask { --c: var(--lilac); }
  .ring { fill: none; stroke: var(--c); stroke-width: 8; stroke-linecap: round; opacity: .16; transition: opacity .5s; }
  .ring.reached { opacity: .45; }
  .ring.current { opacity: 1; }
  .ring-label { font: 800 13px var(--display); fill: var(--c); opacity: .45; text-anchor: middle; dominant-baseline: central; transition: opacity .5s;
    paint-order: stroke; stroke: var(--card); stroke-width: 6px; stroke-linejoin: round; }
  .ring-label.reached, .ring-label.current { opacity: 1; }
  .trail { fill: none; stroke: var(--cream); stroke-width: 3; stroke-linecap: round; stroke-dasharray: .1 8; opacity: .55; }
  .caller { fill: var(--orange); }
  .caller-halo { fill: var(--orange); opacity: .25; }
  .core { fill: var(--green); fill-opacity: 0; stroke: var(--green); stroke-width: 4; transition: fill-opacity .5s; }
  .core-n { font: 800 22px var(--display); fill: var(--green); text-anchor: middle; dominant-baseline: central; }
  .core.full + .core-n { fill: var(--ink); }

  .timeline { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; width: 100%; max-width: 420px; }
  .timeline li { display: grid; gap: 4px; }
  .timeline li::before { content: ""; height: 8px; border-radius: 4px; background: var(--raise); transition: background .5s; }
  .timeline li.reached::before { background: var(--c); }
  .timeline span { font: 700 13px var(--display); color: var(--mist); }
  .timeline b { font: 400 14px var(--data); font-variant-numeric: tabular-nums; }

  .transcript { overflow-y: auto; overscroll-behavior: contain; padding: 22px 26px 36px; min-height: 0; }
  .empty { color: var(--mist); margin-top: 20vh; text-align: center; font: 600 16px var(--display); }
  .turn { max-width: 62ch; width: fit-content; margin-bottom: 12px; padding: 12px 18px 14px; border-radius: 22px; background: var(--raise); }
  .turn.scammer { border-top-left-radius: 6px; }
  .turn.persona { margin-left: 8ch; border-top-right-radius: 6px; background: rgba(157, 149, 255, .13); }
  .turn .who { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .turn .who b { font: 800 14px var(--display); }
  .turn .who time { font: 400 11px var(--data); color: var(--mist); }
  .turn.scammer .who b { color: var(--orange); }
  .turn.persona .who b { color: var(--lilac); }
  .turn .text { font-size: 19px; line-height: 1.5; }
  .tag { font-size: 13px; font-style: italic; color: var(--mist); padding: 0 2px; }
  .tag::before { content: "("; } .tag::after { content: ")"; }
  .goal { margin-top: 6px; font: 400 11.5px/1.5 var(--data); color: var(--mist); }
  .goal::before { content: "goal → "; color: var(--lilac); }
  .hits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .hit { font: 600 13px var(--data); color: var(--ink); background: var(--green); padding: 4px 12px; border-radius: 999px; }
  .hit small { font: 800 11px var(--display); margin-right: 6px; }

  /* footer: the haul, as stickers */
  footer { padding: 14px 26px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  footer h2 { font: 800 24px var(--display); letter-spacing: -.02em; }
  .haul { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; min-height: 56px; align-items: center; }
  .haul .none { color: var(--mist); font-size: 14px; }
  .stamp { background: var(--green); color: var(--ink); border-radius: 18px; padding: 7px 16px 9px; display: grid; gap: 1px; transform: rotate(-3deg); }
  .stamp:nth-child(even) { transform: rotate(2.5deg); }
  .stamp small { font: 800 11px var(--display); }
  .stamp b { font: 600 16px var(--data); }
  .disclaimer { font: 600 12px var(--display); color: var(--mist); }

  @keyframes pulse { 50% { opacity: .3; } }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100vh; padding: 10px; gap: 10px; }
    header { flex-direction: column; gap: 10px; }
    .id { padding: 14px 18px; gap: 12px; }
    .counters { gap: 8px; }
    .counter { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 20px; }
    .counter b { font-size: 30px; }
    .counter span { font-size: 11px; }
    main { grid-template-columns: 1fr; gap: 10px; }
    .vyuh { padding: 20px 16px; }
    .vortex { flex: none; width: 100%; max-width: 300px; }
    .transcript { padding: 18px 14px; overflow: visible; }
    .turn.persona { margin-left: 2ch; }
    footer { padding: 14px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="id card">
    <div class="brand"><span class="mark" lang="sa">चक्रव्यूह</span><span class="latin">Chakravyuh</span></div>
    <div class="line" id="line">No call <small>yet</small></div>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="status-text">Waiting</span></div>
    <a class="report-link" id="report-link" target="_blank" hidden>Open report</a>
  </div>
  <div class="counters">
    <div class="counter time"><span>Scammer time</span><b id="clock">0:00</b></div>
    <div class="counter caught"><span>Identifiers caught</span><b id="n-caught">0</b></div>
    <div class="counter fails"><span>Payments “failed”</span><b id="n-fails">0</b></div>
  </div>
</header>

<main>
  <section class="vyuh card" aria-label="Scam stage">
    <div class="vortex">
      <svg id="rings" viewBox="0 0 400 400" role="img" aria-label="The caller's progress through the scam stages"></svg>
    </div>
    <ol class="timeline" id="timeline"></ol>
  </section>
  <section class="transcript card" id="transcript" aria-live="polite" aria-label="Live transcript">
    <div id="turns"><p class="empty" id="empty">Waiting for a call.</p></div>
  </section>
</main>

<footer class="card">
  <h2>Caught</h2>
  <div class="haul" id="haul"><span class="none">Nothing yet. Identifiers appear here as the caller gives them.</span></div>
  <p class="disclaimer">Simulated scammer · synthetic accounts</p>
</footer>

<!-- Each library is optional: without it the page still works, just without that motion. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
const C = 200;
// Outer to inner. `a` is where the ring's gate sits (degrees, 0 = right, clockwise).
const STAGES = [
  { id: "hook", label: "Hook", r: 172, a: -90 },
  { id: "threat", label: "Threat", r: 132, a: -8 },
  { id: "isolation", label: "Isolation", r: 94, a: 82 },
  { id: "payment_ask", label: "Payment", r: 58, a: 172 },
];
const OUTSIDE = { r: 194, a: -145 };
const TYPES = { upi: "UPI ID", account: "Bank account", ifsc: "IFSC", mobile: "Mobile", url: "Link", email: "Email" };
const STATUS = { screen: "Screening caller", scam: "Scam engaged", genuine: "Genuine caller · AI disclosed" };
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ns) => {
  const n = ns ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const pt = ({ r, a }) => [C + r * Math.cos(a * Math.PI / 180), C + r * Math.sin(a * Math.PI / 180)];
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WIDE = matchMedia("(min-width: 861px)").matches;  // below this the page scrolls, not the transcript
const G = !REDUCE && window.gsap;  // falsy: every update is instant

// Build the vyuh once: each ring is a circle with a gate cut where its label sits.
const svg = $("rings"), rings = {}, labels = {}, ticks = {};
for (const s of STAGES) {
  const ring = el("circle", { cx: C, cy: C, r: s.r, class: `ring ${s.id}` }, true);
  const [x, y] = pt(s);
  const label = el("text", { x, y, class: `ring-label ${s.id}` }, true);
  label.textContent = s.label;
  svg.append(ring, label);
  rings[s.id] = ring; labels[s.id] = label;
  const li = el("li", { class: s.id }); li.innerHTML = `<span>${s.label}</span><b>—</b>`;
  $("timeline").append(li); ticks[s.id] = li;
}
const trail = el("polyline", { class: "trail", points: "" }, true);
const core = el("circle", { cx: C, cy: C, r: 26, class: "core" }, true);
const coreN = el("text", { x: C, y: C, class: "core-n" }, true);
coreN.textContent = "0";
const halo = el("circle", { r: 15, class: "caller-halo" }, true);
const caller = el("circle", { r: 7, class: "caller" }, true);
svg.append(trail, ...Object.values(labels), core, coreN, halo, caller);  // labels sit above the trail

const lenis = window.Lenis && !REDUCE ? new Lenis(WIDE ? { wrapper: $("transcript"), content: $("turns") } : {}) : null;
if (lenis && G) { gsap.ticker.add((t) => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
else if (lenis) requestAnimationFrame(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); });

if (G) gsap.timeline({ defaults: { ease: "power3.out", clearProps: "all" } })  // hand styling back to the CSS classes
  .from([".id", ".counter"], { y: 30, scale: .85, autoAlpha: 0, stagger: .08, duration: .9, ease: "back.out(1.8)" })
  .from(STAGES.map((s) => rings[s.id]), { scale: .55, autoAlpha: 0, svgOrigin: `${C} ${C}`, stagger: .12, duration: 1 }, "<.1")
  .from(Object.values(labels), { autoAlpha: 0, stagger: .12, duration: .6 }, "<.3")
  .from(["#timeline li", "footer"], { y: 10, autoAlpha: 0, stagger: .05, duration: .5 }, "<.2");

function cutGates() {  // gate width follows the label, so it's measured after fonts load
  for (const s of STAGES) {
    const circ = 2 * Math.PI * s.r, gap = labels[s.id].getComputedTextLength() + 30;  // round caps eat into the gap
    s.gap = gap;
    const p = circ * (((s.a % 360) + 360) % 360) / 360;
    rings[s.id].setAttribute("stroke-dasharray", `${circ - gap} ${gap}`);
    rings[s.id].setAttribute("stroke-dashoffset", circ - gap / 2 - p);
  }
}
cutGates();
document.fonts.ready.then(cutGates);

let state;
function reset(name, line) {
  $("report-link").hidden = true;
  state?.moves?.kill();
  state = { start: null, ended: false, stage: "screen", pos: { ...OUTSIDE }, path: [pt(OUTSIDE)], caught: 0, moves: G && gsap.timeline() };
  $("turns").innerHTML = "";
  $("haul").innerHTML = '<span class="none">Nothing yet. Identifiers appear here as the caller gives them.</span>';
  $("line").innerHTML = `${esc(name)} <small>· ${esc(line)}</small>`;
  state.name = name;
  for (const id in rings) { rings[id].classList.remove("reached", "current"); labels[id].classList.remove("reached", "current"); ticks[id].classList.remove("reached"); ticks[id].querySelector("b").textContent = "—"; }
  trail.setAttribute("points", "");
  place();
  setCaught(0);
  $("n-fails").textContent = "0";
}

function place() {
  const [x, y] = pt(state.pos);
  caller.style.transform = halo.style.transform = `translate(${x}px, ${y}px)`;
}

// The caller spirals in along the rings. The trail is sampled from the spiral itself, not from
// animation frames, so a dropped frame (or a burst of replayed events) can't cut a chord across the rings.
function moveCaller(to) {
  let from;
  const at = (j) => ({ r: from.r + (to.r - from.r) * j, a: from.a + (to.a - from.a) * j });
  const draw = (k) => {
    state.pos = at(k);
    place();
    const arc = [];
    for (let i = 0; i <= 48 * k; i++) arc.push(pt(at(i / 48)));
    arc.push(pt(state.pos));
    trail.setAttribute("points", [...state.path, ...arc].map((q) => q.join(",")).join(" "));
    if (k === 1) state.path.push(...arc);
  };
  const begin = () => { from = { ...state.pos }; };
  if (!G) { begin(); return draw(1); }
  const p = { k: 0 };  // queued on the call's timeline, so a burst of stages still spirals in order
  state.moves.to(p, { k: 1, duration: 1.6, ease: "power2.inOut", onStart: begin, onUpdate: () => draw(p.k) });
}

// A colour block jumps when its number changes.
function bump(id) {
  if (G) gsap.fromTo($(id).parentElement, { scale: 1.12, rotation: -3 }, { scale: 1, rotation: 0, duration: 1, ease: "elastic.out(1, .35)" });
}

function setCaught(n) {
  $("n-caught").textContent = coreN.textContent = n;
  core.style.fillOpacity = Math.min(1, n * 0.28);
  core.classList.toggle("full", n >= 3);
}

function setStatus(text, live) {
  $("status-text").textContent = text;
  $("status").classList.toggle("live", live);
}

function applyReport(rep) {
  setStatus(STATUS[rep.mode] || rep.mode, !state.ended);
  if (+$("n-fails").textContent !== rep.payment_fails) { $("n-fails").textContent = rep.payment_fails; bump("n-fails"); }
  const idx = STAGES.findIndex((s) => s.id === rep.stage);
  STAGES.forEach((s, i) => {
    const t = rep.stage_times[s.id];
    if (t !== undefined) ticks[s.id].querySelector("b").textContent = mmss(t);
    ticks[s.id].classList.toggle("reached", i <= idx);
    rings[s.id].classList.toggle("reached", i < idx);
    labels[s.id].classList.toggle("reached", i < idx);
    rings[s.id].classList.toggle("current", i === idx);
    labels[s.id].classList.toggle("current", i === idx);
  });
  if (rep.stage !== state.stage && idx >= 0) {
    state.stage = rep.stage;
    const s = STAGES[idx];
    moveCaller({ r: s.r, a: s.a + (s.gap / 2 + 14) / s.r * 180 / Math.PI });  // just past the gate
  }
  if (rep.identifiers.length !== state.caught) {
    for (const item of rep.identifiers.slice(state.caught)) {
      if (!state.caught) $("haul").innerHTML = "";
      const st = el("div", { class: "stamp" });
      st.innerHTML = `<small>${TYPES[item.type] || item.type}</small><b>${esc(item.value)}</b>`;
      $("haul").append(st);
      if (G) gsap.fromTo(st, { scale: 1.8, rotation: -14, autoAlpha: 0 },
        { scale: 1, rotation: state.caught % 2 ? 2.5 : -3, autoAlpha: 1, duration: .7, ease: "elastic.out(1, .45)" });
      state.caught++;
    }
    setCaught(state.caught);
    bump("n-caught");
    if (G) gsap.fromTo(core, { attr: { r: 36 } }, { attr: { r: 26 }, duration: .9, ease: "elastic.out(1, .4)" });
  }
}

function addTurn(ev) {
  const t = el("article", { class: `turn ${ev.speaker}` });
  const who = ev.speaker === "scammer" ? "Caller · role-played" : state.name;
  const text = esc(ev.text).replace(/&lt;([a-z ]+)&gt;/g, '<span class="tag">$1</span>');
  t.innerHTML = `<div class="who"><b>${esc(who)}</b><time>${mmss(ev.report.duration)}</time></div><p class="text">${text}</p>`;
  if (ev.directive) t.insertAdjacentHTML("beforeend", `<p class="goal">${esc(ev.directive)}</p>`);
  if (ev.found.length) t.insertAdjacentHTML("beforeend", `<div class="hits">${ev.found.map((i) =>
    `<span class="hit"><small>${TYPES[i.type] || i.type}</small>${esc(i.value)}</span>`).join("")}</div>`);
  $("turns").append(t);
  if (G) gsap.from(t, { y: 24, scale: .94, transformOrigin: ev.speaker === "scammer" ? "0 0" : "100% 0", autoAlpha: 0, duration: .7, ease: "back.out(1.7)" });
  if (!WIDE) return;
  const box = $("transcript");
  if (lenis) { lenis.resize(); lenis.scrollTo(lenis.limit, { duration: 1.2 }); }
  else box.scrollTo({ top: box.scrollHeight, behavior: REDUCE ? "auto" : "smooth" });
}

setInterval(() => {
  if (state && state.start && !state.ended) $("clock").textContent = mmss((Date.now() - state.start) / 1000);
}, 250);

const es = new EventSource("/events");
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === "start") { reset(ev.name, ev.line); state.start = ev.at; setStatus("Ringing", true); return; }
  if (!state) return;
  if (ev.type === "turn") { addTurn(ev); applyReport(ev.report); }
  if (ev.type === "end") {
    state.ended = true;
    applyReport(ev.report);
    $("clock").textContent = mmss(ev.report.duration);
    const pc = ev.post_call || {};
    const kind = pc.scam_type ? " · " + pc.scam_type.replace(/_/g, " ") : "";
    setStatus("Call ended · report ready" + kind, false);
    if (pc.id) { $("report-link").href = `/reports/${pc.id}.json`; $("report-link").hidden = false; }
  }
};
es.onerror = () => { if (!state || !state.ended) setStatus("Reconnecting to the call feed", false); };
</script>
</body>
</html>
